name: Android APK oluştur

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Android derleme bağımlılıklarını kur
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 Cython==0.29.36

      # Buildozer ilk çalışmada kendi Android SDK klasörünü indirir.
      # Bu başlangıç denemesi, eksik build-tools nedeniyle hata verse bile devam eder.
      - name: Android SDK'yı başlat
        run: buildozer android debug || true

      - name: AIDL ve Android build-tools yükle
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          SDK_MANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses || true
          "$SDK_MANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: APK oluştur
        run: buildozer android debug

      - name: APK'yı indirilebilir olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: TCP-Hizli-Gonderim-APK
          path: bin/*.apk
          if-no-files-found: error
